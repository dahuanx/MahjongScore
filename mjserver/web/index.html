<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="麻将计分">
<meta name="theme-color" content="#FFF7EC">
<meta name="format-detection" content="telephone=no">
<title>麻将计分器</title>
<style>
:root{
  --paper:#FFF7EC; --ink:#191322; --ink2:#5A5269; --line:#EADFD2;
  --p1:#FFD23F; --p2:#3D7BFF; --p3:#FF3D7F; --p4:#00C9A7;
  --win:#E01B4C; --lose:#00916E;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--paper);
  background-image:radial-gradient(circle,rgba(25,19,34,.075) 1px,transparent 1px);
  background-size:16px 16px;
  color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
.mono{font-family:var(--mono);}
.hidden{display:none !important;}
.wrap{max-width:520px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom));}

/* 贴纸卡片 */
.card{
  background:#fff; border:3px solid var(--ink); border-radius:18px;
  box-shadow:5px 5px 0 var(--ink); padding:18px; margin-bottom:16px;
}
.card.thin{padding:12px 16px;}
.hero{padding:26px 4px 18px;}
.hero h1{font-size:28px;letter-spacing:.5px;}
.hero .sub{color:var(--ink2);font-size:13px;font-weight:600;margin-top:4px;}
.lab{display:block;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--ink2);margin:14px 0 7px;}
.lab:first-child{margin-top:0;}
.field{
  width:100%;padding:13px 14px;font-size:17px;font-weight:700;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;outline:none;
  font-family:inherit;
}
.field:focus{background:#fff;}
.field::placeholder{color:#B6ADBE;font-weight:600;}
.hint{font-size:12px;color:var(--ink2);font-weight:600;margin-top:10px;line-height:1.5;}

/* 按钮 */
.btn{
  display:flex;align-items:center;justify-content:center;
  padding:14px 16px;font-size:16px;font-weight:800;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:14px;
  box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-family:inherit;
  transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.btn.fill{background:var(--p1);}
.btn.dark{background:var(--ink);color:#fff;box-shadow:4px 4px 0 var(--p2);}
.btn.dark:active{box-shadow:1px 1px 0 var(--p2);}
.btn.big{padding:16px;font-size:17px;width:100%;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.row2{display:flex;gap:10px;margin-top:16px;}
.row2 .btn{flex:1;}
.ghost{background:var(--paper);}
.kv{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink2);padding:3px 0;}
.kv b{color:var(--ink);}
.foot{text-align:center;font-size:11.5px;color:#8C8496;font-weight:600;padding:12px 0 0;}

/* 牌桌 */
.top{
  display:flex;align-items:center;gap:8px;padding:12px 0 10px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--paper) 78%,rgba(255,247,236,0));
}
.roomtag{display:flex;align-items:baseline;gap:6px;background:#fff;border:2.5px solid var(--ink);
  border-radius:11px;padding:5px 10px;box-shadow:3px 3px 0 var(--ink);}
.roomtag .ts{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--ink2);}
.roomtag b{font-size:16px;letter-spacing:1px;}
.roundtag{font-size:12px;font-weight:800;background:var(--ink);color:#fff;padding:6px 10px;border-radius:10px;}
.chip{margin-left:auto;font-size:12.5px;font-weight:800;background:#fff;border:2.5px solid var(--ink);
  border-radius:10px;padding:7px 11px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:inherit;color:var(--ink);}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.conn{font-size:11.5px;font-weight:800;color:var(--ink2);padding:2px 4px 8px;}
.conn.ok{color:var(--lose);} .conn.bad{color:var(--win);}

.seats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px;}
.seat{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:4px 4px 0 var(--ink);padding:11px 12px 12px;cursor:pointer;
  transition:transform .06s,box-shadow .06s;min-height:92px;
  display:flex;flex-direction:column;
}
.seat:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.seat.me{background:var(--p1);}
.seat.offline{opacity:.5;}
.seat.empty{background:var(--paper);border-style:dashed;box-shadow:none;cursor:default;}
.seatHead{display:flex;align-items:center;gap:6px;}
.wind{width:20px;height:20px;flex:none;background:var(--ink);color:#fff;border-radius:6px;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.wind.blank{background:#CFC6D6;}
.seatName{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.metag{margin-left:auto;font-size:9.5px;font-weight:800;background:var(--ink);color:#fff;
  padding:2px 6px;border-radius:6px;flex:none;}
.seatScore{margin-top:auto;font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.seatScore.pos{color:var(--win);} .seatScore.neg{color:var(--lose);}
.seatHost{font-size:9.5px;font-weight:800;color:var(--ink2);margin-top:2px;}

.flowhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;
  font-size:11px;font-weight:800;letter-spacing:2px;color:var(--ink2);}
.flowhead span:last-child{letter-spacing:0;font-family:var(--mono);}
.flow{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.ticket{
  background:#fff;border:2.5px solid var(--ink);border-radius:13px;padding:9px 12px;
  box-shadow:3px 3px 0 var(--ink);
  display:flex;align-items:center;gap:10px;
}
.ticket.new{background:#FFFBEA;border-color:var(--ink);}
.ticket .seq{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink2);flex:none;}
.ticket .main{flex:1;min-width:0;}
.ticket .t1{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticket .t2{font-size:11px;font-weight:700;color:var(--ink2);margin-top:1px;}
.ticket .amt{font-family:var(--mono);font-size:17px;font-weight:800;color:var(--win);flex:none;}
.empty2{text-align:center;font-size:12.5px;font-weight:700;color:#9C93A6;padding:22px 0;}

.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;gap:9px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  background:var(--paper);border-top:3px solid var(--ink);
  max-width:520px;margin:0 auto;
}
.actions .btn{flex:1;padding:13px 8px;font-size:15px;}

/* 弹层 */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.mask{position:absolute;inset:0;background:rgba(25,19,34,.45);}
.panel{
  position:relative;width:100%;max-width:520px;background:var(--paper);
  border:3px solid var(--ink);border-radius:22px 22px 0 0;border-bottom:none;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 0 var(--ink);
  animation:up .18s ease-out;
  max-height:92vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(26px);opacity:.6;}to{transform:none;opacity:1;}}
.sheetTop{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ava{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex:none;}
.wname{font-size:16px;font-weight:800;}
.wsub{font-size:11.5px;font-weight:800;color:var(--ink2);}
.x{margin-left:auto;width:34px;height:34px;border-radius:11px;background:#fff;border:2.5px solid var(--ink);
  font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kinds.one{grid-template-columns:1fr;}
.kind{
  background:#fff;border:2.5px solid var(--ink);border-radius:13px;padding:11px 12px;
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);
}
.kind.on{background:var(--p1);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.kind .kn{font-size:14.5px;font-weight:800;}
.kind .kp{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink2);margin-top:1px;}
.preview{
  margin:14px 0;padding:11px 13px;background:#fff;border:2.5px dashed var(--ink);
  border-radius:13px;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.6;
}
.preview b{color:var(--ink);font-family:var(--mono);}
.dlg{padding:18px 16px calc(16px + env(safe-area-inset-bottom));}
.dlg h3{font-size:17px;margin-bottom:6px;}
.dlg p{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:16px;line-height:1.6;}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:12px;
  z-index:99;max-width:84vw;text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <section id="v-lobby">
    <div class="hero">
      <h1>麻将计分器</h1>
      <p class="sub">纯积分记账 · 手机浏览器版</p>
    </div>
    <div class="card">
      <label class="lab">我的昵称</label>
      <input id="name" class="field" maxlength="8" placeholder="最多 8 个字" autocomplete="nickname">
      <label class="lab">房间号</label>
      <input id="room" class="field mono" inputmode="numeric" placeholder="留空 = 开新桌" autocomplete="off">
      <div class="row2">
        <button id="goBtn" class="btn fill">进 入 牌 桌</button>
      </div>
      <p class="hint" id="hint">房间号留空即由你开一桌新牌局。</p>
    </div>
    <div class="card thin">
      <div class="kv"><span>服务器</span><b class="mono" id="srvText">--</b></div>
      <div class="kv"><span>状态</span><b id="connText">未连接</b></div>
    </div>
    <p class="foot">与安卓版同桌同步 · 同一份流水与总分</p>
  </section>

  <section id="v-table" class="hidden">
    <header class="top">
      <div class="roomtag"><span class="ts">房间</span><b class="mono" id="roomNo">----</b></div>
      <div class="roundtag" id="roundNo">第 1 局</div>
      <button class="chip" id="leaveBtn">退出</button>
    </header>
    <div class="conn" id="connBar">已连接</div>
    <div class="seats" id="seats"></div>
    <div class="flowhead"><span>对局流水</span><span id="flowSum">0 局</span></div>
    <div class="flow" id="flow"></div>
    <div class="actions">
      <button class="btn ghost" id="windBtn">吊风</button>
      <button class="btn ghost" id="undoBtn">撤销</button>
      <button class="btn dark" id="endBtn">结束</button>
    </div>
  </section>

</div>

<div id="sheet" class="sheet hidden">
  <div class="mask" id="sheetMask"></div>
  <div class="panel">
    <div class="sheetTop">
      <div class="ava" id="sheetAva"></div>
      <div style="min-width:0">
        <div class="wname" id="sheetName">--</div>
        <div class="wsub" id="sheetSub">胡了</div>
      </div>
      <button class="x" id="sheetClose">×</button>
    </div>
    <div class="kinds" id="kinds"></div>
    <div class="preview" id="preview"></div>
    <button class="btn dark big" id="confirmBtn">确认记分</button>
  </div>
</div>

<div id="dialog" class="sheet hidden">
  <div class="mask" id="dlgMask"></div>
  <div class="panel dlg">
    <h3 id="dlgTitle">确认</h3>
    <p id="dlgText"></p>
    <div class="row2">
      <button class="btn ghost" id="dlgNo">取消</button>
      <button class="btn dark" id="dlgYes">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
"use strict";

var DEFAULTS = {pinghu:5, dianpao:20, zimo:10, loubao:20, baozhongbao:40};
var KIND_NAME = {pinghu:"平胡", dianpao:"点炮", zimo:"自摸", loubao:"搂宝", baozhongbao:"宝中宝"};
var SELF_KINDS = ["pinghu","zimo","loubao","baozhongbao"];
var LOSER_KINDS = ["dianpao"];
var PCOLORS = ["var(--p1)","var(--p2)","var(--p3)","var(--p4)"];

var qs = new URLSearchParams(location.search);
var HOST_PORT = qs.get("srv") || "182.92.191.33:9100";
var WSURL = "ws://" + HOST_PORT + "/ws";

var S = {
  ws: null, conn: "idle", retry: 0, timer: null,
  room: "", me: "", host: "", closed: false,
  players: [], rounds: [], balances: {}, scores: {},
  pendingWinner: null, pendingKind: null,
  joinArgs: null, inTable: false
};

/* ---------- 基础工具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shortName(n){
  n = (n || "").trim();
  if (!n) return "?";
  var arr = Array.from(n);
  return arr[arr.length - 1];
}
function colorOf(id){
  if (id === S.me) return PCOLORS[0];
  var h = 0;
  for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return PCOLORS[h % 4];
}
function nameOf(id){
  for (var i = 0; i < S.players.length; i++) if (S.players[i].id === id) return S.players[i].name || "牌友";
  return "牌友";
}
function pointsOf(kind){
  if (S.scores && S.scores[kind] != null) return S.scores[kind];
  return DEFAULTS[kind] || 0;
}
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.add("hidden"); }, 2200);
}
function ask(title, text, okText, fn){
  $("dlgTitle").textContent = title;
  $("dlgText").textContent = text;
  $("dlgYes").textContent = okText || "确定";
  $("dialog").classList.remove("hidden");
  S._dlgOk = fn;
}
function closeAsk(){ $("dialog").classList.add("hidden"); S._dlgOk = null; }
$("dlgNo").onclick = closeAsk;
$("dlgMask").onclick = closeAsk;
$("dlgYes").onclick = function(){ var f = S._dlgOk; closeAsk(); if (f) f(); };

/* ---------- 身份 ---------- */
function loadIdentity(){
  var pid = localStorage.getItem("mj_pid");
  if (!pid) {
    pid = "web-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    localStorage.setItem("mj_pid", pid);
  }
  S.me = pid;
  var n = localStorage.getItem("mj_name");
  if (n) $("name").value = n;
  var r = localStorage.getItem("mj_room");
  if (r) $("room").value = r;
  $("srvText").textContent = HOST_PORT;
}

/* ---------- 连接 ---------- */
function connect(args){
  S.joinArgs = args;
  if (S.ws && (S.ws.readyState === 0 || S.ws.readyState === 1)) return;
  setConn("connecting");
  var ws;
  try { ws = new WebSocket(WSURL); } catch (e) { setConn("error"); toast("无法连接服务器"); return; }
  S.ws = ws;
  ws.onopen = function(){
    if (S.timer) { clearTimeout(S.timer); S.timer = null; }
    setConn("open"); S.retry = 0; sendJoin();
  };
  ws.onmessage = function(ev){
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    handle(m);
  };
  ws.onclose = function(){
    setConn("closed");
    if (S.inTable) scheduleReconnect();
  };
  ws.onerror = function(){ setConn("error"); };
}

function scheduleReconnect(){
  if (S.timer) return;
  S.retry = Math.min(S.retry + 1, 8);
  var wait = Math.min(1000 * S.retry, 6000);
  $("connBar").textContent = "连接断开，正在重连…";
  $("connBar").className = "conn bad";
  S.timer = setTimeout(function(){
    S.timer = null;
    if (S.inTable) connect(S.joinArgs);
  }, wait);
}

function sendJoin(){
  var name = ($("name").value || "").trim() || "牌友";
  var room = S.room || (S.joinArgs && S.joinArgs.room) || "";
  var msg = {type:"join", player_id:S.me, name:name};
  if (room) msg.room = room;
  send(msg);
}

function send(obj){
  if (!S.ws || S.ws.readyState !== 1) { toast("还没连上，稍等一下"); return false; }
  S.ws.send(JSON.stringify(obj));
  return true;
}

function setConn(state){
  S.conn = state;
  var txt = {idle:"未连接", connecting:"连接中…", open:"已连接", closed:"已断开", error:"连接失败"}[state] || state;
  $("connText").textContent = txt;
  $("connText").style.color = state === "open" ? "var(--lose)" : (state === "idle" ? "" : "var(--win)");
  if (state === "open" && S.inTable) {
    $("connBar").textContent = "已连接 · 实时同步";
    $("connBar").className = "conn ok";
  }
}

/* ---------- 消息处理 ---------- */
function handle(m){
  if (m.type === "error") { toast(m.msg || "操作失败"); return; }
  if (m.type === "state") {
    S.room = m.room || S.room;
    if (m.you) S.me = m.you;
    S.host = m.host || "";
    S.players = m.players || [];
    S.rounds = m.rounds || [];
    S.balances = m.balances || {};
    if (m.scores) S.scores = m.scores;
    S.closed = !!m.closed;
    if (m.closed) { onClosed(); return; }
    S.inTable = true;
    localStorage.setItem("mj_room", S.room);
    $("v-lobby").classList.add("hidden");
    $("v-table").classList.remove("hidden");
    $("connBar").textContent = "已连接 · 实时同步";
    $("connBar").className = "conn ok";
    renderTable();
    return;
  }
  if (m.type === "round") {
    if (m.rounds && m.rounds.length) S.rounds = S.rounds.concat(m.rounds);
    if (m.balances) S.balances = m.balances;
    renderTable(true);
    return;
  }
  if (m.type === "undid") {
    S.rounds = m.rounds || [];
    if (m.balances) S.balances = m.balances;
    renderTable();
    toast("已撤销");
    return;
  }
  if (m.type === "peers") {
    S.players = m.players || S.players;
    if (S.inTable) renderSeats();
    return;
  }
  if (m.type === "scores") {
    S.scores = m.scores || {};
    if (S.pendingWinner) renderSheet();
    return;
  }
}

function onClosed(){
  S.inTable = false;
  S.closed = true;
  if (S.ws) { try { S.ws.close(); } catch (e) {} S.ws = null; }
  localStorage.removeItem("mj_room");
  closeSheet();
  S.room = ""; S.host = "";
  $("v-table").classList.add("hidden");
  $("v-lobby").classList.remove("hidden");
  $("room").value = "";
  setConn("idle");
  toast("对局已结束");
}

/* ---------- 渲染 ---------- */
function renderTable(isNew){
  $("roomNo").textContent = S.room || "----";
  $("roundNo").textContent = "第 " + (S.rounds.length + 1) + " 局";
  renderSeats();
  renderFlow(isNew);
  var isHost = S.host === S.me;
  $("undoBtn").classList.toggle("hidden", !isHost);
  $("endBtn").classList.toggle("hidden", !isHost);
}

function renderSeats(){
  var list = S.players.slice().sort(function(a, b){ return a.seat - b.seat; });
  var html = "";
  for (var i = 0; i < 4; i++) {
    var p = list[i];
    if (!p) {
      html += '<div class="seat empty"><div class="seatHead"><div class="wind blank">-</div>'
            + '<div class="seatName" style="color:#9C93A6">空座</div></div>'
            + '<div class="seatScore" style="color:#CFC6D6">--</div></div>';
      continue;
    }
    var bal = S.balances[p.id] || 0;
    var cls = bal > 0 ? "pos" : (bal < 0 ? "neg" : "");
    var sign = bal > 0 ? "+" : "";
    html += '<div class="seat ' + (p.id === S.me ? "me " : "") + (p.online === false ? "offline" : "") + '" data-id="' + esc(p.id) + '">'
          +   '<div class="seatHead">'
          +     '<div class="wind' + (p.wind ? "" : " blank") + '">' + (p.wind ? esc(p.wind.charAt(0)) : "-") + '</div>'
          +     '<div class="seatName">' + esc(p.name || "牌友") + '</div>'
          +     (p.id === S.me ? '<div class="metag">我</div>' : "")
          +   '</div>'
          +   '<div class="seatScore ' + cls + '">' + sign + bal + '</div>'
          +   '<div class="seatHost">' + (p.host ? "房主" : "") + (p.online === false ? (p.host ? " · 离线" : "离线") : "") + '&nbsp;</div>'
          + '</div>';
  }
  $("seats").innerHTML = html;
  Array.prototype.forEach.call($("seats").querySelectorAll(".seat[data-id]"), function(el){
    el.addEventListener("click", function(){ openSheet(el.getAttribute("data-id")); });
  });
}

function renderFlow(isNew){
  $("flowSum").textContent = S.rounds.length + " 局";
  if (!S.rounds.length) {
    $("flow").innerHTML = '<div class="empty2">还没有记分 · 点上面任意一位开始</div>';
    return;
  }
  var html = "";
  for (var i = S.rounds.length - 1; i >= 0; i--) {
    var r = S.rounds[i];
    var payers = (r.payers && r.payers.length) ? r.payers : (r.loser ? [r.loser] : []);
    var gain = r.points * payers.length;
    var pnames = payers.map(function(id){ return nameOf(id); }).join("、");
    var t2 = r.kind === "dianpao"
      ? esc(pnames) + " 点炮 · 单付 " + r.points
      : pnames + " 各付 " + r.points;
    html += '<div class="ticket' + (isNew && i === S.rounds.length - 1 ? " new" : "") + '">'
          +   '<div class="seq">' + r.seq + '</div>'
          +   '<div class="main"><div class="t1">' + esc(nameOf(r.winner)) + ' · ' + (KIND_NAME[r.kind] || r.kind) + '</div>'
          +   '<div class="t2">' + t2 + '</div></div>'
          +   '<div class="amt">+' + gain + '</div>'
          + '</div>';
  }
  $("flow").innerHTML = html;
}

/* ---------- 记分弹层 ---------- */
function openSheet(winnerId){
  if (!S.inTable) return;
  if (S.players.length < 4) { toast("坐满4人才能开始记分（当前 " + S.players.length + "/4）"); return; }
  S.pendingWinner = winnerId;
  var mine = winnerId === S.me;
  var kinds = mine ? SELF_KINDS : LOSER_KINDS;
  S.pendingKind = kinds[0];
  $("sheet").classList.remove("hidden");
  renderSheet();
}

function closeSheet(){
  S.pendingWinner = null;
  S.pendingKind = null;
  $("sheet").classList.add("hidden");
}

function renderSheet(){
  var wid = S.pendingWinner;
  if (!wid) return;
  var wname = nameOf(wid);
  var mine = wid === S.me;
  $("sheetAva").textContent = shortName(wname);
  $("sheetAva").style.background = colorOf(wid);
  $("sheetName").textContent = wname;
  $("sheetSub").textContent = mine ? "我胡了 · 选胡型" : "他胡了 · 你点炮";

  var kinds = mine ? SELF_KINDS : LOSER_KINDS;
  if (kinds.indexOf(S.pendingKind) < 0) S.pendingKind = kinds[0];
  var kh = "";
  kinds.forEach(function(k){
    kh += '<button class="kind' + (S.pendingKind === k ? " on" : "") + '" data-k="' + k + '">'
        +   '<div class="kn">' + KIND_NAME[k] + '</div>'
        +   '<div class="kp">' + pointsOf(k) + ' / 家</div>'
        + '</button>';
  });
  $("kinds").className = "kinds" + (kinds.length === 1 ? " one" : "");
  $("kinds").innerHTML = kh;
  Array.prototype.forEach.call($("kinds").querySelectorAll(".kind"), function(el){
    el.addEventListener("click", function(){
      S.pendingKind = el.getAttribute("data-k");
      renderSheet();
    });
  });

  var pts = pointsOf(S.pendingKind);
  var payers = S.pendingKind === "dianpao"
    ? [S.me]
    : S.players.filter(function(p){ return p.id !== wid; }).map(function(p){ return p.id; });
  var total = pts * payers.length;
  var pn = payers.map(function(id){ return nameOf(id); }).join("、");
  $("preview").innerHTML = payers.length
    ? '<b>' + esc(pn) + '</b> 各付 <b>' + pts + '</b> · 共 <b>' + payers.length + '</b> 家<br>'
      + esc(wname) + ' 得 <b>+' + total + '</b>'
    : "人数不足，无法记分";
  $("confirmBtn").disabled = payers.length === 0;
}

$("sheetMask").onclick = closeSheet;
$("sheetClose").onclick = closeSheet;
$("confirmBtn").onclick = function(){
  if (!S.pendingWinner || !S.pendingKind) return;
  var ok = send({type:"play", winner:S.pendingWinner, kind:S.pendingKind});
  if (ok) closeSheet();
};

/* ---------- 底部操作 ---------- */
$("windBtn").onclick = function(){
  var n = S.players.length;
  if (n < 4) { toast("坐满4人才能吊风（当前 " + n + "/4）"); return; }
  ask("重新吊风？", "东南西北会重新随机分配，已记的分数不受影响。", "吊风", function(){
    send({type:"wind"});
  });
};
$("undoBtn").onclick = function(){
  if (!S.rounds.length) { toast("没有可撤销的流水"); return; }
  var last = S.rounds[S.rounds.length - 1];
  ask("撤销第 " + last.seq + " 局？",
      nameOf(last.winner) + " · " + (KIND_NAME[last.kind] || last.kind) + "，撤销后分数会一起回退。",
      "撤销", function(){ send({type:"undo", seq:last.seq}); });
};
$("endBtn").onclick = function(){
  ask("结束对局？", "结束后这个房间会解散，所有人退出，无法再进入。", "确认结束", function(){
    send({type:"end"});
  });
};
$("leaveBtn").onclick = function(){
  ask("退出牌桌？", "牌局不会结束，你可以用房间号再回来。", "退出", function(){
    S.inTable = false;
    if (S.ws) { try { S.ws.close(); } catch (e) {} S.ws = null; }
    S.players = []; S.rounds = []; S.balances = {}; S.host = "";
    $("v-table").classList.add("hidden");
    $("v-lobby").classList.remove("hidden");
    localStorage.removeItem("mj_room");
    $("room").value = "";
    setConn("idle");
  });
};

/* ---------- 大厅 ---------- */
$("goBtn").onclick = function(){
  var name = ($("name").value || "").trim();
  if (!name) { $("name").focus(); toast("先起个昵称"); return; }
  localStorage.setItem("mj_name", name);
  var room = ($("room").value || "").trim();
  if (room) localStorage.setItem("mj_room", room); else localStorage.removeItem("mj_room");
  S.joinArgs = {room: room};
  if (S.ws && S.ws.readyState === 1) {
    sendJoin();
  } else {
    connect({room: room});
  }
};

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState !== "visible") return;
  if (!S.inTable) return;
  if (!S.ws || S.ws.readyState > 1) {
    S.timer && clearTimeout(S.timer);
    S.timer = null;
    connect(S.joinArgs);
  }
});
window.addEventListener("pageshow", function(){
  if (S.inTable && (!S.ws || S.ws.readyState > 1)) connect(S.joinArgs);
});

loadIdentity();
setConn("idle");

/* 调试句柄：无头验证与远程排障用，不影响正常使用 */
window.__MJ = { S: S, handle: handle, renderTable: renderTable, openSheet: openSheet };
})();
</script>
</body>
</html>
